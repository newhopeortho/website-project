 else if(id==='Sidon')art=html`<${Fragment}><path d="M0 130 Q100 90 200 120 T400 110 T600 130 V220H0Z" fill="#a8946e" opacity=".7"/><rect x="0" y="214" width="600" height="106" fill="#3f86ad"/><path d="M0 214 H600 V230 H0Z" fill="#cfb182"/>${[0,1,2,3,4].map(i=>html`<g><rect x=${60+i*60} y=${180-(i%2)*8} width="44" height=${34+(i%2)*8} fill="#d3b484"/><rect x=${72+i*60} y="196" width="10" height="18" fill="#6b4a2a"/></g>`)}<path d="M390 214 Q430 180 470 214Z" fill="#cfb182"/><rect x="420" y="170" width="20" height="20" fill="#ecd9b2"/><path d="M400 214 Q460 270 540 214" stroke="#a87c50" stroke-width="8" fill="none"/><rect x="500" y="190" width="14" height="26" fill="#b99a6a"/>${SAIL(120,282,.9)}${SAIL(300,296,1)}${SAIL(470,284,.8)}${P(180,222,'#7a5a9a',{s:.95})}</${Fragment}>`;
 else art=html`<${Fragment}><path d="M0 170 Q150 130 300 160 T600 150 V230H0Z" fill="#b7a07a" opacity=".6"/><rect x="0" y="226" width="600" height="94" fill="#3f86ad"/><path d="M0 226 Q300 206 600 226 V240 H0Z" fill="#d9c48e"/>${[0,1,2,3].map(i=>html`<g><rect x=${60+i*54} y="190" width="40" height="36" fill="#e2d2ac"/><rect x=${72+i*54} y="206" width="9" height="20" fill="#6b4a2a"/></g>`)}<rect x="300" y="170" width="70" height="56" fill="#d3b484"/><path d="M294 170 L335 148 L376 170Z" fill="#b85a3a"/><path d="M400 226 H560 M420 226 V250 M540 226 V250" stroke="#8a6a3a" stroke-width="6"/><path d="M390 250 H570" stroke="#b99a6a" stroke-width="5"/>${PALM(30,226,.8)}${SAIL(470,282,1)}${SAIL(200,292,.9)}${P(340,238,'#e8dfc6')}</${Fragment}>`;
 return html`<svg class="illus" viewBox="0 0 600 320" role="img" aria-label=${'AI illustration of an imagined archaeological site: '+id+', '+CITIES.find(x=>x.id===id).civ+' civilization. Not a photograph.'}>${sky}${art}</svg>`;
}
function Scene({id}){if(CITIES.find(x=>x.id===id).extra)return html`<${Gen2} id=${id}/>`;return html`<${Generic} id=${id}/>`;}
function App(){
 const [sel,setSel]=useState('Uruk');const [order,setOrder]=useState('chrono');const [min,setMin]=useState(0);const [civ,setCiv]=useState('All');
 let list=CITIES.filter(c=>c.mid>=min&&(civ==='All'||c.civ===civ));list=[...list].sort((a,b)=>order==='chrono'?a.yr-b.yr:order==='desc'?b.mid-a.mid:a.mid-b.mid);
 const city=CITIES.find(c=>c.id===sel);const hidden=!list.some(c=>c.id===sel);const pick=id=>setSel(id);
 return html`<${Fragment}><h1 class="flint-title">Ancient World Cities Before 350 BC</h1><p class="flint-lede">Pick a stop on the timeline to explore 29 large cities at their approximate peak.</p>
 <div class="warn" role="note"><strong>Uncertainty warning:</strong> ancient population figures and city boundaries are uncertain. Estimates come from different methods and sources, so they are not a precise or directly comparable census or ranking.</div>
 <div class="flint-card flint-stack"><div class="ctrl"><div><label>Sort order</label><div class="flint-segmented" role="group" aria-label="Sort order">${[['chrono','Chronological'],['desc','Population ↓'],['asc','Population ↑']].map(([k,t])=>html`<button aria-pressed=${order===k} onClick=${()=>setOrder(k)}>${t}</button>`)}</div></div>
 <div><label for="civ">Civilization</label><select id="civ" value=${civ} onChange=${e=>setCiv(e.target.value)}><option value="All">All civilizations</option>${CIVS.map(c=>html`<option value=${c}>${c}</option>`)}</select></div>
 <div><button onClick=${()=>{setCiv('All');setMin(0);setOrder('chrono')}}>Clear filters</button></div>
 <div style="flex:1;min-width:200px"><div class="flint-slider"><div class="flint-slider-head"><label for="thr">Show cities with approx. population of at least</label><output>${min.toLocaleString()}</output></div><input id="thr" type="range" min="0" max="320000" step="20000" value=${min} onInput=${e=>setMin(+e.target.value)} /></div></div>
 <div><label for="sel">Choose a city</label><select id="sel" value=${sel} onChange=${e=>pick(e.target.value)}>${CITIES.map(c=>html`<option value=${c.id}>${c.id} — ${c.date}</option>`)}</select></div></div>
 <p class="cap">${order==='chrono'?'Ordered by date.':'Ordered by approximate population; for ranges, the middle of the range is used only to order entries.'} Showing ${list.length} of ${CITIES.length} cities.</p><p class="cap">Civilization groupings are broad historical labels; cities may have changed rulers or cultures over time.</p>
 ${list.length?html`<div class="tl" role="group" aria-label="Timeline of cities">${list.map(c=>html`<button class="stop" aria-pressed=${c.id===sel} onClick=${()=>pick(c.id)}><strong>${c.id.split(' (')[0]}</strong><small>${c.date}</small><span class="civ">${c.civ}</span></button>`)}</div>`:html`<p>No cities match these filters. Lower the slider or choose All civilizations.</p>`}
 ${hidden?html`<p class="cap">The selected city (${sel}) is hidden by the filter, but is still shown below.</p>`:null}</div>
 <div class="flint-split"><div><${Scene} key=${city.id} id=${city.id}/><p class="cap"><strong>AI illustration — not a photograph.</strong> A loose, imagined impression, not an exact reconstruction.</p></div>
 <div class="flint-card flint-stack" aria-live="polite"><h2 style="margin:0">${city.id}</h2><div><span class="flint-badge">${city.date}</span> <span class="civ">${city.civ}</span></div><div><div class="cap">Region</div>${city.where}</div><div><div class="cap">Estimated peak population</div><div class="pop">${city.popTxt}</div><div class="cap">Approximate; uncertain.</div></div><p style="margin:0">${city.d}</p>
 ${city.extra?html`<p class="unc" style="margin:0">Population is an estimate or broad range, not a direct count; low-confidence figures are very rough inferences from settlement extent, density or source compilations.</p>`:null}
 <section class="found" aria-label="How and when it was founded"><h3>How and when it was founded</h3><dl><dt>Approximate beginning</dt><dd>${city.founding.begin}</dd>${city.founding.tradition?html`<dt>Tradition / legend</dt><dd>${city.founding.tradition}</dd>`:null}<dt>Archaeology / scholars</dt><dd>${city.founding.arch}</dd></dl></section></div></div>
 <div class="flint-panel src"><strong>Sources and method.</strong> Ancient city population values come from incomparable source estimates with uncertain boundaries and methods; urban populations may differ from wider civic totals (as with Greek poleis and Sparta). Added cities use conservative rough ranges. City figures are drawn from historical compilations commonly associated with Chandler and Modelski and related scholarship. They are estimates based on uneven archaeological and historical evidence, and scholars disagree; none are unanimous or definitive. Uruk's c. 2800 BC figure is reported around 80,000 in an ancient-city overview; early-city compilations give Memphis around 60,000 c. 2000 BC and Thebes around 40,000 c. 1800 BC; a Chandler-based compilation lists Nineveh near 100,000 by 668 BC; Babylon sources commonly range around 150,000–200,000 near 500 BC; compilation figures for Athens are near 40,000 c. 430 BC, Xiadu near 320,000 c. 400 BC, and Carthage near 500,000 c. 300 BC.</div></${Fragment}>`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
